
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOCIAL X</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10111a;color:white;font-family:Arial,sans-serif}
header{padding:18px;background:#191a27;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.logo{font-size:25px;font-weight:900;background:linear-gradient(90deg,#ff4c9b,#8b5cf6);color:transparent;background-clip:text}
button{border:0;border-radius:12px;padding:11px 15px;background:#8b5cf6;color:white;font-weight:bold;cursor:pointer}
main{max-width:600px;margin:auto;padding:14px}
.stories{display:flex;gap:14px;overflow-x:auto;padding:14px 0}
.story{text-align:center;min-width:65px;font-size:12px}
.circle{width:58px;height:58px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#ff4c9b,#ffbd4a,#8b5cf6);margin:auto auto 6px}
.circle span{display:grid;place-items:center;background:#292a38;width:100%;height:100%;border-radius:50%;font-size:23px}
.card{background:#1c1d2b;border-radius:17px;margin:15px 0;overflow:hidden}
.posthead{display:flex;align-items:center;gap:10px;padding:13px}
.avatar{width:39px;height:39px;border-radius:50%;background:#5140a0;display:grid;place-items:center;font-size:20px}
.postimage{height:300px;display:grid;place-items:center;font-size:65px;background:linear-gradient(140deg,#30205e,#a13c83,#f08b63)}
.postbody{padding:14px}
.actions{display:flex;gap:18px;margin-bottom:12px}
.actions button{background:transparent;padding:3px;font-size:21px}
.caption{color:#ddd;line-height:1.5}
.muted{color:#999;font-size:12px}
nav{position:sticky;bottom:0;background:#191a27;display:flex;justify-content:space-around;padding:13px}
nav button{background:transparent;font-size:20px;padding:5px}
#notice{color:#bda7ff;text-align:center;padding:8px}
</style>
</head>
<body>
<header>
<div class="logo">SOCIAL X ✦</div>
<button onclick="alert('Welcome to SOCIAL X!')">Explore</button>
</header>
<main>
<h3>Stories</h3>
<div class="stories">
<div class="story"><div class="circle"><span>＋</span></div>Your story</div>
<div class="story"><div class="circle"><span>😎</span></div>Alex</div>
<div class="story"><div class="circle"><span>🌸</span></div>Priya</div>
<div class="story"><div class="circle"><span>🎧</span></div>Rahul</div>
<div class="story"><div class="circle"><span>⚽</span></div>Sam</div>
</div>
<div class="card">
<div class="posthead"><div class="avatar">👤</div><div><b>Your feed</b><div class="muted">Discover what's happening</div></div></div>
<div class="postbody">
<textarea id="postText" placeholder="What's happening? Share an update..." style="width:100%;padding:12px;border-radius:12px;background:#292a38;color:white;border:1px solid #444;min-height:65px"></textarea>
<br><br><button onclick="addPost()">＋ Create post</button>
</div>
</div>
<div id="feed">
<div class="card">
<div class="posthead"><div class="avatar">🌍</div><div><b>SocialX Community</b><div class="muted">Sample post · Public</div></div></div>
<div class="postimage">🌅</div>
<div class="postbody"><div class="actions"><button onclick="like(this)">♡ <span>24</span></button><button onclick="comment()">💬</button><button onclick="share()">↗</button></div><div class="caption"><b>SocialX Community</b> Welcome to a new world of connections! ✨</div></div>
</div>
</div>
<div id="notice">Welcome to SOCIAL X — Your world, your connections.</div>
</main>
<nav>
<button onclick="location.reload()">⌂</button>
<button onclick="document.getElementById('postText').focus()">＋</button>
<button onclick="alert('Explore page coming soon!')">⌕</button>
<button onclick="alert('Messages coming soon!')">✉</button>
<button onclick="alert('Your profile coming soon!')">👤</button>
</nav>
<script>
function like(btn){
let s=btn.querySelector('span');
let n=Number(s.textContent);
s.textContent=btn.classList.toggle('liked')?n+1:n-1;
btn.style.color=btn.classList.contains('liked')?'#ff4c9b':'white';
}
function addPost(){
let t=document.getElementById('postText');
if(!t.value.trim()){alert('Write something first!');return}
let c=document.createElement('div');
c.className='card';
c.innerHTML='<div class="posthead"><div class="avatar">👤</div><div><b>You</b><div class="muted">Just now · Demo post</div></div></div><div class="postbody"><div class="caption"></div></div>';
c.querySelector('.caption').textContent=t.value;
document.getElementById('feed').prepend(c);
t.value='';
}
function comment(){alert('Comments feature is coming soon!')}
function share(){alert('Sharing feature is coming soon!')}
</script>
</body>
</html>
